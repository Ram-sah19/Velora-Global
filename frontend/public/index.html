<!DOCTYPE html>
<html lang="en">

    <meta charset="utf-8" />
    
    <!-- Google Search Favicon & Multi-Browser Compliant Tags -->
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="48x48 32x32 16x16" type="image/x-icon" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="%PUBLIC_URL%/favicon-48x48.png" />

    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- LCP: the hero backdrop is painted by React, so without this the browser cannot
         discover it until JS runs. Preloading starts the fetch during HTML parsing. -->
    <link rel="preload" as="image" href="%PUBLIC_URL%/images/background.webp" type="image/webp" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#0a2540" />

    <!-- Security & Performance Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />

    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="google14a618a8649b198c" />

    <!-- Search Engine Primary SEO Meta Tags -->
    <title>Velora Global | Technology Training, Internships & Enterprise Solutions</title>
    <meta name="title" content="Velora Global | Technology Training, Internships & Enterprise Solutions" />
    <meta
      name="description"
      content="Custom web and mobile software, AI chatbot systems, project-driven internships and guided technology training from Velora Global in Kathmandu, Nepal."
    />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="author" content="Velora Global" />
    <meta name="publisher" content="Velora Global" />
    <link rel="canonical" href="https://velora-global.online/" />

    <!--
      No meta keywords (a stuffing signal Google has ignored since 2009) and no
      geo.position/ICBM tags: the precise coordinates were never verified, and
      search engines do not use these tags for local relevance.
    -->

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp Social Card Previews -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://velora-global.online/" />
    <meta property="og:title" content="Velora Global | Technology Training, Internships & Enterprise Solutions" />
    <meta
      property="og:description"
      content="Practical technology training, project-driven internships, and custom enterprise IT solutions (Web, Mobile & AI) in Kathmandu, Nepal."
    />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Velora Global — technology training, project internships and enterprise software, Kathmandu Nepal" />
    <meta property="og:site_name" content="Velora Global" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ne_NP" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://velora-global.online/" />
    <meta name="twitter:title" content="Velora Global | Technology Training, Internships & Enterprise Solutions" />
    <meta
      name="twitter:description"
      content="Practical technology training, project-driven internships, and custom enterprise IT solutions (Web, Mobile & AI) in Kathmandu, Nepal."
    />
    <meta name="twitter:image" content="https://velora-global.online/og-image.png" />
    <meta name="twitter:image:alt" content="Velora Global — technology training, project internships and enterprise software, Kathmandu Nepal" />

    <!-- AI Agent Discovery: only documents this site actually serves -->
    <link rel="ai-catalog" type="application/json" href="%PUBLIC_URL%/.well-known/ai-catalog.json" />
    <link rel="api-catalog" type="application/linkset+json" href="%PUBLIC_URL%/.well-known/api-catalog" />
    <link rel="agent-skills" type="application/json" href="%PUBLIC_URL%/.well-known/agent-skills/index.json" />
    <link rel="service-desc" type="application/openapi+json" href="%PUBLIC_URL%/openapi.json" />

    <!-- WebMCP tools are registered by src/webmcp.js at boot, with working execute()
         handlers. A second inline copy here declared the same three tool names with no
         handler, and its provideContext() appended rather than replaced — so an agent
         reading navigator.modelContext.tools could pick a declaration that could never
         run. The bundle is the single source of truth. -->

    <!-- Google Fonts: Plus Jakarta Sans (body) & Outfit (headings, --font-heading in index.css) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap was loaded for its grid/utilities, but no Bootstrap class is used anywhere in
         src/ (layout is inline styles + index.css) and the CSP above refused it, so it cost a
         render-blocking round trip on every route for nothing. index.css defines the only
         overlapping selectors itself: .container, .badge, .btn, .btn-primary. -->

      the edge replaces this whole block per route, so /services never publishes the
      homepage FAQ. Kept here for hosts that serve build/ without the functions
      bundle. node scripts/sync-embedded-graph.mjs --check fails if the two drift.
    -->

        {
          "@type": "FAQPage",
          "@id": "https://velora-global.online/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What does Velora Global do?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Velora Global is a technology company based in Kathmandu, Nepal. It builds custom web applications, cross-platform iOS and Android mobile apps and AI chatbot systems for business clients, and runs project-driven internships and guided training programs for students and working professionals."
              }
            },
            {
              "@type": "Question",
              "name": "Are Velora Global internship certificates verifiable?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Every certificate we issue carries a unique verification ID such as VG-2026-88491. Anyone, including an employer or a university, can check it against our public verification endpoint at https://velora-global.online/api/certificates/verify/{certificateId}, which returns the recipient, domain, issue date, duration and grade on record."
              }
            },
            {
              "@type": "Question",
              "name": "Who evaluates student project submissions?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Project deliverables and code repositories are reviewed by our founding team: Abhishek Sah (Founder & CEO), Krishna Sah (Co-Founder & CTO) and Rohit Sah (Co-Founder & COO). Each submission is scored against five published criteria and returned with written remarks."
              }
            },
            {
              "@type": "Question",
              "name": "What is the difference between the Internship and Training programs?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "The Internship program is project-driven and task-oriented: you work on deliverables with mentor feedback and milestone reviews. The Guided Training program is lecture-led, with step-by-step development, full codebase walkthroughs and an option to continue into an internship track."
              }
            },
            {
              "@type": "Question",
              "name": "What are the 5 criteria used for project grading?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Evaluations assess Quality of Code, Technical Mastery, Creative Problem Solving, Completion of Requirements, and Professional Documentation. Candidates receive written feedback along with their final certificate record."
              }
            },
            {
              "@type": "Question",
              "name": "Can I participate in the internship remotely?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Every internship and training track supports remote participation, with schedules designed for university students and working professionals."
              }
            }
          ]
        }
