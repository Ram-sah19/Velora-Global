        if (window.navigator) {
          if (!window.navigator.modelContext) {
            window.navigator.modelContext = {
              tools: tools,
              provideContext: function(ctx) { if (ctx && ctx.tools) { this.tools.push.apply(this.tools, ctx.tools); } },
              getTools: function() { return this.tools; }
            };
          } else if (typeof window.navigator.modelContext.provideContext === 'function') {
            try { window.navigator.modelContext.provideContext({ tools: tools }); } catch(e) {}
          }
        }
      })();
