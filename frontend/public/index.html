<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#0b0f19" />

    <!-- Security Headers (meta-level for Cloudflare Pages / Static Hosting) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()" />

    <!-- Search Engine Primary SEO Meta Tags -->
    <title>Velora Global | Internship, Tech Training & Enterprise Solutions</title>
    <meta name="title" content="Velora Global | Internship, Tech Training & Enterprise Solutions" />
    <meta
      name="description"
      content="Velora Global empowers students and tech candidates with accredited remote internships, hands-on software development training, QR-verified certificates, and enterprise digital solutions."
    />
    <meta
      name="keywords"
      content="Velora Global, Velora, Tech Internships, Web Development Internship, AI ML Internship, Data Science Internship, Software Testing, Remote Internships, Verified QR Certificate, Career Development"
    />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="author" content="Velora Global Executive Leadership" />
    <link rel="canonical" href="https://velora-global.pages.dev" />

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp Social Card Previews -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://velora-global.pages.dev" />
    <meta property="og:title" content="Velora Global | Internship, Tech Training & Enterprise Solutions" />
    <meta
      property="og:description"
      content="Gain real-world project experience, executive mentorship from Rohit Sah, Rambilas Sah & Puja Rouniyar, and official QR-verified certificates."
    />
    <meta property="og:image" content="https://velora-global.pages.dev/media/rambilas_sah.jpg" />
    <meta property="og:site_name" content="Velora Global" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://velora-global.pages.dev" />
    <meta name="twitter:title" content="Velora Global | Internship & Career Platform" />
    <meta
      name="twitter:description"
      content="Accredited remote internship programs across Software Engineering, AI/ML, Cloud DevOps, UI/UX, and Quality Assurance."
    />
    <meta name="twitter:image" content="https://velora-global.pages.dev/media/rambilas_sah.jpg" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS & Tailwind CSS for Mobile Responsiveness -->

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Schema.org JSON-LD Structured Data for Google Rich Search Results & Knowledge Panel -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "Velora Global",
      "url": "https://velora-global.pages.dev",
      "logo": "https://velora-global.pages.dev/favicon.svg",

        "https://linkedin.com/company/velora-global"
      ],
      "description": "Enterprise digital solutions, accredited tech internships, and professional career development platform.",
      "founder": [
        {
          "@type": "Person",
          "name": "Rohit Sah",
          "jobTitle": "Founder & CEO"
        },
        {
          "@type": "Person",
          "name": "Krishna Sah",
          "jobTitle": "Co-Founder"
        },
        {
          "@type": "Person",
          "name": "Puja Rouniyar",
          "jobTitle": "Co-Founder & COO"
        }
