<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D061" />
      <stop offset="35%" stop-color="#E5A93C" />
      <stop offset="70%" stop-color="#C48821" />
      <stop offset="100%" stop-color="#9A650C" />
    </linearGradient>

    <!-- Light Gold Metallic Highlight -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="50%" stop-color="#E5A93C" />
      <stop offset="100%" stop-color="#B87D17" />
    </linearGradient>

    <!-- Silver Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#D1D5DB" />
      <stop offset="80%" stop-color="#9CA3AF" />
      <stop offset="100%" stop-color="#6B7280" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- 'V' Gold Swoosh Stroke -->
    <path d="M 140,140 
             C 170,140 210,180 240,290 
             C 255,340 270,380 290,385 
             C 270,380 245,340 230,290
             C 200,190 160,165 140,140 Z" 
          fill="url(#goldLight)" />

    <path d="M 140,140 
             L 210,140 
             C 230,220 260,330 290,385 
             C 250,380 210,290 180,210 Z" 
          fill="url(#goldGrad)" />

    <!-- Right Wing of V / Overlap -->
    <path d="M 290,385 
             C 270,300 240,200 340,140 
             C 260,180 250,280 290,385 Z" 
          fill="url(#goldGrad)" />

    <!-- 'G' Silver Crescent Arc -->
    <path d="M 270,385 
             C 320,385 370,360 380,290 
             L 310,290 
             L 310,260 
             L 410,260 
             C 410,360 340,410 270,385 Z" 
          fill="url(#silverGrad)" />

    <!-- Gold 4-Point Star Element -->
    <path d="M 375,150 
             Q 375,170 395,170 
             Q 375,170 375,190 
             Q 375,170 355,170 
             Q 375,170 375,150 Z" 
          fill="url(#goldLight)" />
  </g>
</svg>
